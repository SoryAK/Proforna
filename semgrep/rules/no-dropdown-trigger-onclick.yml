rules:
  - id: dropdown-menu-trigger-no-onclick
    pattern-either:
      - pattern: <DropdownMenuTrigger ... onClick={...} />
      - pattern: <DropdownMenuTrigger ... onClick={...}>...</DropdownMenuTrigger>
    paths:
      include:
        - "**/src/**/*.tsx"
    message: |
      base-ui DropdownMenuTrigger opens via its own internal onClick handler.
      Passing an onClick prop causes React last-write-wins to clobber it, and
      the menu silently won't open. Use onMouseDown for stopPropagation or
      restructure DOM so event propagation isn't needed.
    severity: ERROR
    languages: [typescript]
    metadata:
      origin: "User memory note 2026-06-08 — base-ui Trigger internal handler."
      category: "shadcn-ui-v2-base-ui-guard"
