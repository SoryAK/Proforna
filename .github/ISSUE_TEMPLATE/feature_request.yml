name: Feature request
description: Suggest an improvement to Proforna
title: "[Feature]: "
labels:
  - enhancement
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Use this for a focused feature request.

        A large or exploratory change starts with the problem. A UI change uses the UI design form and includes at least three detailed mocks.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is missing or painful today?
      placeholder: Describe the occupant problem, not only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Proforna do?
      placeholder: Describe the change you want to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches did you consider?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, links, or implementation notes.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This request is scoped to a single problem or workflow.
          required: true
