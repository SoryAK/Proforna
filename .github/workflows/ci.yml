name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md

      - uses: pnpm/action-setup@v4
        if: hashFiles('package.json') != ''
        with:
          version: 10.17.1

      - uses: actions/setup-node@v7
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: hashFiles('package.json') != ''

      - run: npx prisma generate
        if: hashFiles('prisma/schema.prisma') != ''

      - run: pnpm test
        if: hashFiles('package.json') != ''

  # Deploy lands when the app exists. Keep the job so the pipeline shape is fixed.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        run: |
          if [ ! -f package.json ]; then
            echo "No app yet — skip deploy."
            exit 0
          fi
          echo "Wire Vercel/hosting here when the app is back."
          exit 0
