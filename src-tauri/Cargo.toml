[package]
name = "proforna"
version = "0.0.1"
description = "Proforna desktop shell"
authors = ["Sory Kaba"]
edition = "2021"

[lib]
name = "proforna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
