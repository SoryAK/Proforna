<!--
  Prototype, throwaway. Not the Career History page.
  Floating panel: profile, role, and a miniature gallery that opens over the map.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype · Focus panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" />
    <style>
      :root {
        --ink: #f5f2ee;
        --muted: #c9b8a0;
        --line: rgba(199, 164, 123, 0.4);
        --hair: rgba(199, 164, 123, 0.22);
        --card: #13100d;
        --gold: #a78b71;
        --gold-light: #c9b8a0;
        --gold-hover: #e8d5b7;
        --paper: #080706;
        --sans: "Geist Variable", "Geist", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-width: 1100px;
        background: #0a0a0a;
        color: var(--ink);
        font: 16px/1.5 var(--sans);
      }

      ::selection { background: rgba(167, 139, 113, 0.45); color: var(--ink); }

      * { scrollbar-width: thin; scrollbar-color: rgba(167, 139, 113, 0.45) transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: rgba(167, 139, 113, 0.45); border-radius: 999px; }

      body { padding: 0.45rem 0.75rem 2rem; }

      .mark {
        margin: 0 0 0.35rem;
        padding: 0 0.15rem;
        color: var(--muted);
        font-size: 0.8125rem;
      }

      .identity {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 2.75rem;
        margin: 0 0.15rem 0.45rem;
      }

      .brand {
        margin: 0;
        color: var(--gold-hover);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .stage {
        position: relative;
        height: calc(100vh - 5.4rem);
        min-height: 34rem;
        margin: 0 0.15rem;
      }

      .column {
        position: absolute;
        z-index: 2;
        top: 0.75rem;
        bottom: 0.75rem;
        left: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        width: min(24rem, 38vw);
        overflow: auto;
      }

      .card {
        flex: none;
        border: 1px solid var(--hair);
        border-radius: 16px;
        background: #0d0b09;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      }

      .profile { padding: 0.85rem 0.9rem 1rem; }

      .home {
        margin: 0 0 0.75rem;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--gold-light);
        font: 600 0.8125rem/1 var(--sans);
        cursor: pointer;
      }

      .profile-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .profile-bar .home { margin: 0; }

      .know-card {
        display: grid;
        gap: 0.5rem;
        width: 100%;
        margin-top: 0.75rem;
        padding: 0.75rem 0 0;
        border: 0;
        border-top: 1px solid var(--hair);
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .know-card:hover { color: var(--ink); }

      .know-card:focus-visible {
        outline: 2px solid var(--gold-hover);
        outline-offset: 2px;
      }

      .know-card b {
        font-size: 0.875rem;
        font-weight: 600;
      }

      .gallery-strip.is-one { grid-template-columns: 1fr; }
      .gallery-strip.is-two { grid-template-columns: 1fr 1fr; }

      .gallery-strip .spot {
        display: grid;
        place-items: center;
        height: 100%;
        border-radius: 8px;
        background: #1a1510;
        color: var(--gold-hover);
        font-size: 0.75rem;
      }

      .who {
        display: flex;
        gap: 0.75rem;
        align-items: flex-start;
      }

      .mark-face {
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        flex: none;
        overflow: hidden;
        border-radius: 50%;
        background: #1c1814;
        color: var(--gold-hover);
        font-weight: 600;
      }

      .mark-face img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .profile-photo-edit {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .socials {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-top: 0.65rem;
      }

      .social-mark {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--gold-light);
        font: 600 0.75rem/1.2 var(--sans);
        text-decoration: none;
        cursor: pointer;
      }

      .social-mark svg {
        width: 0.875rem;
        height: 0.875rem;
        flex: none;
      }

      .social-mark:hover { color: var(--ink); }

      .social-mark:focus-visible {
        outline: 2px solid var(--gold-hover);
        outline-offset: 2px;
      }

      #github-card .social-mark { margin-top: 0.85rem; }

      .profile h2 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }

      .profile p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.875rem; }

      .role-card, .hub-card { padding: 0; }

      .job-card { overflow: hidden; }

      .job-photo {
        height: 6rem;
        background: #1a1510;
      }

      .job-photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #1a1510;
      }

      .job-copy {
        display: grid;
        gap: 0.15rem;
        padding: 0.7rem 0.9rem 0.85rem;
      }

      .job-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .job-copy h3 {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25;
      }

      .job-edit,
      #editor-back {
        flex: none;
        padding: 0.5rem 0.75rem;
        border: 1px solid rgba(199, 164, 123, 0.35);
        border-radius: 999px;
        background: transparent;
        color: var(--gold-light);
        font: 600 0.75rem/1.2 var(--sans);
        cursor: pointer;
      }

      .job-edit:hover,
      #editor-back:hover {
        border-color: var(--gold-hover);
        background: rgba(167, 139, 113, 0.16);
        color: var(--ink);
      }

      .job-copy .title {
        margin: 0;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.35;
      }

      .job-copy .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem;
        margin: 0.1rem 0 0;
        color: var(--muted);
        font-size: 0.6875rem;
        line-height: 1.35;
      }

      .current {
        padding: 0 0.25rem;
        border-radius: 3px;
        background: rgba(16, 185, 129, 0.18);
        color: #6ee7b7;
        font-size: 0.6875rem;
        font-weight: 600;
        line-height: 1.45;
      }

      .tenure { color: rgba(185, 170, 151, 0.72); }

      .job-copy .duty {
        margin: 0.35rem 0 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.35;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .job-pills {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 0.4rem;
        max-height: 4.75rem;
        margin-top: 0.45rem;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .job-pills > * {
        flex: none;
        white-space: nowrap;
      }

      .job-links a,
      .job-pills a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid rgba(199, 164, 123, 0.45);
        border-radius: 999px;
        color: var(--gold-light);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.2;
        text-decoration: none;
        transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
      }

      .job-pills svg,
      .job-links svg {
        width: 0.875rem;
        height: 0.875rem;
        flex: none;
      }

      .job-pills a span,
      .job-links a span {
        padding-left: 0.5rem;
        border-left: 1px solid rgba(199, 164, 123, 0.35);
      }

      .job-pills a:hover,
      .job-links a:hover {
        border-color: var(--gold-hover);
        background: rgba(167, 139, 113, 0.22);
        color: var(--ink);
      }

      .job-pills a:hover span,
      .job-links a:hover span { border-left-color: rgba(232, 213, 183, 0.55); }
      .job-pills a:focus-visible,
      .job-links a:focus-visible {
        outline: 2px solid var(--gold-hover);
        outline-offset: 2px;
      }

      .job-more-toggle {
        padding: 0.5rem 0.75rem;
        border: 1px solid rgba(199, 164, 123, 0.35);
        border-radius: 999px;
        background: transparent;
        color: var(--gold-light);
        font: 600 0.75rem/1.2 var(--sans);
        cursor: pointer;
      }

      .job-more-toggle:hover {
        border-color: var(--gold-hover);
        background: rgba(167, 139, 113, 0.16);
        color: var(--ink);
      }

      .job-more-toggle:focus-visible {
        outline: 2px solid var(--gold-hover);
        outline-offset: 2px;
      }

      .people-list {
        display: grid;
        gap: 0.75rem;
      }

      .person-card a:focus-visible {
        outline: 2px solid var(--gold-hover);
        outline-offset: 2px;
      }

      .avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.25rem;
        height: 1.25rem;
        flex: none;
        border-radius: 999px;
        background: rgba(167, 139, 113, 0.28);
        color: var(--gold-hover);
        font-size: 0.6875rem;
        font-weight: 600;
      }

      .person-card {
        display: grid;
        gap: 0.5rem;
        padding: 0.75rem;
        border: 1px solid rgba(199, 164, 123, 0.35);
        border-radius: 12px;
        background: #0e0c0a;
      }

      .person-card-head {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 0.75rem;
        align-items: center;
      }

      .person-card .avatar {
        width: 2rem;
        height: 2rem;
        font-size: 0.75rem;
      }

      .person-card strong {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25;
      }

      .person-title,
      .person-blurb {
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .person-title { display: block; }

      .person-blurb { margin: 0; }

      .person-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .person-links a {
        display: inline-flex;
        align-items: center;
        padding: 0.5rem 0.75rem;
        border: 1px solid rgba(199, 164, 123, 0.45);
        border-radius: 999px;
        color: var(--gold-light);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.2;
        text-decoration: none;
      }

      .person-links a:hover {
        border-color: var(--gold-hover);
        background: rgba(167, 139, 113, 0.22);
        color: var(--ink);
      }

      .field-hint {
        margin: 0;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .job-more {
        display: grid;
        gap: 0.85rem;
        margin-top: 1rem;
      }

      .job-more h3 {
        margin: 0 0 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.3;
      }

      .job-more p {
        margin: 0;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.45;
      }

      .job-more ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .job-more li {
        padding: 0.4rem 0;
        border-top: 1px solid var(--hair);
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .job-more li:first-child { border-top: 0; padding-top: 0; }

      .gallery-card {
        display: grid;
        gap: 0.5rem;
        width: 100%;
        padding: 0.75rem;
        border: 0;
        border-radius: 16px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .gallery-card:hover { background: rgba(167, 139, 113, 0.08); }

      .gallery-card:focus-visible {
        outline: 2px solid var(--gold-hover);
        outline-offset: 2px;
      }

      .gallery-strip {
        display: grid;
        grid-template-columns: 1.7fr 0.72fr 0.72fr;
        gap: 0.35rem;
        height: 4.5rem;
      }

      .gallery-strip img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
        background: #1a1510;
      }

      .gallery-strip > img:last-child { object-position: 82% 35%; }

      .thumb-video {
        position: relative;
        display: block;
        min-width: 0;
      }

      .thumb-video img { object-position: 18% 60%; }

      .play-badge {
        position: absolute;
        top: 50%;
        left: 50%;
        display: grid;
        place-items: center;
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 50%;
        background: rgba(8, 7, 6, 0.72);
        color: var(--ink);
        transform: translate(-50%, -50%);
      }

      .play-badge svg { width: 0.7rem; height: 0.7rem; }

      .gallery-card b {
        font-size: 0.875rem;
        font-weight: 600;
      }

      .gallery-label {
        color: var(--muted);
        font-size: 0.75rem;
      }

      .gallery-scroll {
        display: flex;
        gap: 0.75rem;
        margin-top: 1rem;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding-bottom: 0.75rem;
      }

      .gallery-scroll figure {
        flex: 0 0 15.5rem;
        margin: 0;
        scroll-snap-align: start;
      }

      .gallery-scroll img,
      .gallery-scroll video {
        display: block;
        width: 100%;
        height: 10.5rem;
        object-fit: cover;
        border-radius: 12px;
        background: #1a1510;
      }

      .event-line { display: grid; gap: 0.35rem; margin-top: 0.35rem; }

      .gallery-scroll figcaption {
        display: grid;
        gap: 0.25rem;
        padding-top: 0.75rem;
      }

      .gallery-scroll strong {
        font-size: 0.875rem;
        font-weight: 600;
      }

      .gallery-scroll figcaption span {
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .clip {
        position: relative;
        --pan: 0;
      }

      .clip img {
        object-position: calc(8% + (var(--pan) * 72%)) center;
      }

      .play {
        position: absolute;
        top: 50%;
        left: 50%;
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        padding: 0.75rem;
        border: 0;
        border-radius: 50%;
        background: rgba(8, 7, 6, 0.78);
        color: var(--ink);
        transform: translate(-50%, -62%);
        cursor: pointer;
      }

      .play svg { width: 0.9rem; height: 0.9rem; }

      .play:focus-visible {
        outline: 2px solid var(--gold-hover);
        outline-offset: 2px;
      }

      .clip-bar {
        position: absolute;
        right: 0.75rem;
        bottom: 0.75rem;
        left: 0.75rem;
        display: grid;
        gap: 0.35rem;
      }

      .clip-bar span {
        color: var(--ink);
        font-size: 0.75rem;
        font-weight: 600;
      }

      .clip-bar input {
        width: 100%;
        margin: 0;
        accent-color: #e8d5b7;
      }

      .gallery-events {
        margin-top: 0.5rem;
        padding-top: 0.85rem;
        border-top: 1px solid var(--hair);
      }

      .gallery-events h3,
      .event-view h3 {
        margin: 0 0 0.5rem;
        font-size: 0.875rem;
        font-weight: 600;
      }

      .sample-note,
      .event-view .title,
      .event-view .duty,
      .callout-place {
        margin: 0;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .event-row {
        display: grid;
        gap: 0.15rem;
        width: 100%;
        margin-top: 0.35rem;
        padding: 0.75rem;
        border: 1px solid var(--hair);
        border-radius: 12px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .event-row:hover { background: rgba(167, 139, 113, 0.12); }

      .event-row:focus-visible,
      .event-actions button:focus-visible,
      .event-back:focus-visible,
      .map-callout button:focus-visible {
        outline: 2px solid var(--gold-hover);
        outline-offset: 2px;
      }

      .event-row strong {
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25;
      }

      .event-row .event-kind,
      .event-view .title { color: var(--muted); font-size: 0.75rem; }

      .event-row .event-meta,
      .event-view .meta {
        margin: 0.1rem 0 0;
        color: var(--muted);
        font-size: 0.6875rem;
        line-height: 1.35;
      }

      .event-row .event-gist {
        overflow: hidden;
        margin: 0.35rem 0 0;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.35;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .event-view { display: grid; gap: 0.15rem; margin-top: 1rem; }

      .event-view[hidden],
      .gallery-home[hidden],
      .map-callout[hidden] { display: none; }

      .event-view h3 { margin-top: 0.85rem; }

      .event-view ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .event-view li {
        padding: 0.75rem 0.75rem 0.75rem 0.85rem;
        border-top: 1px solid var(--hair);
        border-left: 2px solid var(--gold);
        color: var(--ink);
        font-size: 0.875rem;
        line-height: 1.4;
      }

      .event-view li:first-child { border-top: 0; }

      .event-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.85rem;
      }

      .event-actions button,
      .map-callout button {
        padding: 0.5rem 0.75rem;
        border: 1px solid rgba(199, 164, 123, 0.35);
        border-radius: 999px;
        background: transparent;
        color: var(--gold-light);
        font: 600 0.75rem/1.2 var(--sans);
        cursor: pointer;
      }

      .event-actions button:hover,
      .map-callout button:hover {
        border-color: var(--gold-hover);
        background: rgba(167, 139, 113, 0.16);
        color: var(--ink);
      }

      .event-back {
        justify-self: start;
        margin-top: 0.75rem;
        padding: 0.5rem 0.75rem;
        border: 0;
        background: transparent;
        color: var(--gold-light);
        font: 600 0.75rem/1.2 var(--sans);
        cursor: pointer;
      }

      .event-back:hover { color: var(--gold-hover); }

      .crud-bar,
      .select-bar,
      .confirm-actions,
      .item-actions,
      .cover-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      .select-bar[hidden],
      .add-panel[hidden] { display: none; }

      .add-anchor { position: relative; }

      .crud-bar button,
      .select-bar button,
      .add-panel button,
      .item-actions button,
      .cover-actions button,
      .cover-file,
      .confirm-actions button,
      .job-actions button,
      .gallery-add button {
        padding: 0.5rem 0.75rem;
        border: 1px solid rgba(199, 164, 123, 0.35);
        border-radius: 999px;
        background: #13100d;
        color: var(--gold-light);
        font: 600 0.75rem/1.2 var(--sans);
        cursor: pointer;
      }

      .crud-bar button:hover,
      .select-bar button:hover,
      .add-panel button:hover,
      .item-actions button:hover,
      .cover-actions button:hover,
      .cover-file:hover,
      .confirm-actions button:hover,
      .job-actions button:hover,
      .gallery-add button:hover {
        border-color: var(--gold-hover);
        background: rgba(167, 139, 113, 0.16);
        color: var(--ink);
      }

      button:disabled { cursor: not-allowed; opacity: 0.45; }

      button.is-danger {
        border-color: rgba(205, 103, 86, 0.55);
        color: #e6a196;
      }

      .add-panel {
        position: absolute;
        z-index: 5;
        top: calc(100% + 0.35rem);
        left: 0;
        display: grid;
        min-width: 9rem;
        padding: 0.35rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #13100d;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }

      .add-panel button {
        border: 0;
        border-radius: 8px;
        background: transparent;
        text-align: left;
      }

      .select-bar {
        padding: 0.75rem;
        border: 1px solid var(--hair);
        border-radius: 12px;
        background: #13100d;
      }

      .select-bar span {
        margin-right: auto;
        color: var(--muted);
        font-size: 0.75rem;
      }

      .job-card.is-focus { border-color: var(--line); }

      .check,

  const endMatch = !job.current && /^(\d{4})-(\d{2})/.exec(job.end || "");
  const end = endMatch ? new Date(Number(endMatch[1]), Number(endMatch[2]) - 1, 1) : new Date(2026, 9, 24);
  let months = (end.getFullYear() - Number(match[1])) * 12 + (end.getMonth() - (Number(match[2]) - 1));
  if (months < 0) months = 0;
  const years = Math.floor(months / 12);
  const rest = months % 12;
  if (years && rest) return `(${years}y ${rest}m)`;
  if (years) return `(${years}y)`;
  return `(${rest}m)`;
}

function jobById(id) {
  return state.jobs.find((job) => job.id === id) || null;
}

function focusedJob() {

}

function jobMedia(jobId) {
  return state.media.filter((item) => item.jobId === jobId);
}

function jobEvents(jobId) {
  return state.events.filter((item) => item.jobId === jobId);
}

function jobPeople(jobId) {
  return state.people.filter((item) => item.jobId === jobId);
}

function initials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return `${parts[0][0]}${parts[parts.length - 1][0]}`.toUpperCase();
}

function safeHref(url) {
  const value = String(url || "").trim();
  if (/^https?:\/\//i.test(value) || /^mailto:/i.test(value)) return value;
  return "";
}

function parseLinks(value) {
  return lines(value).map((line) => {
    const parts = line.split("|").map((part) => part.trim()).filter(Boolean);
    if (!parts.length) return null;
    let label = "Link";
    let url = parts[0];
    if (parts.length >= 2) {
      label = parts[0];
      url = parts.slice(1).join(" | ");
    }
    if (!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)) url = `https://${url}`;
    return { label, url };
  }).filter(Boolean);
}

function coverOf(jobId) {
  return jobMedia(jobId).find((item) => item.kind === "photo" && item.url) || null;
}

function kindLabel(kind) {
  if (kind === "video") return "Video";
  if (kind === "attachment") return "Attachment";
  if (kind === "other") return "Other";
  return "Photo";
}

function checkedKeys() {
  return [...state.checked];
}

function keyKind(key) {
  return key.split(":")[0];
}

function sameKind() {

}

function textInput(name, value, type) {

function selectBox(name, options, value) {

function fileUrl(file) {
  return new Promise((resolve) => {
    if (file.type.startsWith("video/")) {
      resolve(URL.createObjectURL(file));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.readAsDataURL(file);
  });
}

function writeJob(job, form, bulk) {
  const data = new FormData(form);
  const textKeys = ["title", "organization", "place", "start", "end", "duty", "description", "website", "linkedin"];
  for (const key of textKeys) {
    const value = String(data.get(key) || "").trim();
    if (bulk) {
      if (value) job[key] = value;
    } else job[key] = value;
  }
  const achievements = lines(data.get("achievements"));
  if (bulk) {
    if (achievements.length) job.achievements = achievements;
    const current = String(data.get("current") || "");
    if (current === "yes") job.current = true;
    if (current === "no") job.current = false;
  } else {
    job.achievements = achievements;
    job.current = data.get("current") === "on";
  }
}

function writePerson(item, form) {
  const data = new FormData(form);
  item.name = String(data.get("name") || "").trim();
  item.title = String(data.get("title") || "").trim();
  item.blurb = String(data.get("blurb") || "").trim();
  item.links = parseLinks(data.get("links"));
}

function writeEvent(item, form, bulk) {
  const data = new FormData(form);
  for (const key of ["title", "date", "kind", "place", "detail"]) {
    const value = String(data.get(key) || "").trim();
    if (bulk) {
      if (value) item[key] = value;
    } else item[key] = value;
  }
  if (!bulk) item.highlights = lines(data.get("highlights"));
}

async function writeMedia(item, form, bulk) {
  const data = new FormData(form);
  const kind = String(data.get("kind") || "");
  const title = String(data.get("title") || "").trim();
  const caption = String(data.get("caption") || "").trim();
  const url = String(data.get("url") || "").trim();
  const file = data.get("file");
  if (bulk) {
    if (kind) item.kind = kind;
    if (title) item.title = title;
    if (caption) item.caption = caption;
    const pub = String(data.get("isPublic") || "");
    if (pub === "yes") item.isPublic = true;
    if (pub === "no") item.isPublic = false;
    if (kind && kind !== "video") delete item.player;
    return;
  }
  item.kind = kind || "photo";
  item.title = title || "Untitled";
  item.caption = caption;
  item.isPublic = data.get("isPublic") === "on";
  if (file instanceof File && file.size) {
    item.url = await fileUrl(file);
    delete item.player;
  } else if (url) {
    item.url = url;
    delete item.player;
  }
}

function nextSpot() {
  return SPOTS[state.events.length % SPOTS.length];
}

async function saveEditor(event) {
  event.preventDefault();
  const form = event.target instanceof HTMLFormElement ? event.target : event.currentTarget;
  const mode = editorMode;
  if (!mode) return;
  if (mode.type === "media") {
    const host = focusedJob();
    if (!mode.id && !host) return;
    if (mode.id) {
      const item = state.media.find((entry) => entry.id === mode.id);
      if (item) await writeMedia(item, form, false);
    } else {
      const item = { id: nid("media"), jobId: host.id, url: "", isPublic: false };
      await writeMedia(item, form, false);
      state.media.push(item);
    }
  } else if (mode.type === "event") {
    const host = focusedJob();
    if (!mode.id && !host) return;
    if (mode.id) {
      const item = state.events.find((entry) => entry.id === mode.id);
      if (item) writeEvent(item, form, false);
    } else {
      const [top, left] = nextSpot();
      const item = { id: nid("event"), jobId: host.id, highlights: [], top, left };
      writeEvent(item, form, false);
      if (!item.title) item.title = "Untitled event";
      state.events.push(item);
    }
  } else if (mode.type === "person") {
    const host = focusedJob();
    if (!mode.id && !host) return;
    if (mode.id) {
      const item = state.people.find((entry) => entry.id === mode.id);
      if (item) writePerson(item, form);
    } else {
      const item = { id: nid("person"), jobId: host.id, links: [] };
      writePerson(item, form);
      if (!item.name) item.name = "Unnamed";
      state.people.push(item);
    }
  }
  showEditorHome();
  renderAll();
}

function askRemove(message) {
  return new Promise((resolve) => {
    document.querySelector("#confirm-text").textContent = message;
    function done() {
      confirmDialog.removeEventListener("close", done);
      resolve(confirmDialog.returnValue === "remove");
    }
    confirmDialog.addEventListener("close", done);
    confirmDialog.showModal();
  });
}

function dropKeys(keys) {
  const jobs = new Set(keys.filter((key) => key.startsWith("job:")).map((key) => key.slice(4)));
  const media = new Set(keys.filter((key) => key.startsWith("media:")).map((key) => key.slice(6)));
  const events = new Set(keys.filter((key) => key.startsWith("event:")).map((key) => key.slice(6)));
  const people = new Set(keys.filter((key) => key.startsWith("person:")).map((key) => key.slice(7)));
  state.media = state.media.filter((item) => !media.has(item.id) && !jobs.has(item.jobId));
  state.events = state.events.filter((item) => !events.has(item.id) && !jobs.has(item.jobId));
  const personal = new Set(keys.filter((key) => key.startsWith("personal:")).map((key) => key.slice(9)));
  state.people = state.people.filter((item) => !people.has(item.id) && !jobs.has(item.jobId));
  state.personal = state.personal.filter((item) => !personal.has(item.id));
  const socials = new Set(keys.filter((key) => key.startsWith("social:")).map((key) => key.slice(7)));
  state.socials = state.socials.filter((item) => !socials.has(item.id));
  if (state.openPerson && !state.people.some((item) => item.id === state.openPerson)) state.openPerson = null;
  state.jobs = state.jobs.filter((job) => !jobs.has(job.id));
  for (const key of keys) state.checked.delete(key);
  for (const key of [...state.checked]) {
    const [kind, id] = [keyKind(key), key.slice(key.indexOf(":") + 1)];
    const alive = kind === "job" ? jobById(id) : kind === "media" ? state.media.some((item) => item.id === id) : state.events.some((item) => item.id === id);
    if (!alive) state.checked.delete(key);
  }
  if (!jobById(state.focus)) state.focus = state.jobs[0] ? state.jobs[0].id : "";
  if (state.mapEvent && !state.events.some((item) => item.id === state.mapEvent)) {
    state.mapEvent = null;
    mapCallout.hidden = true;
    mapWorld.style.transform = "";
    mapNote.textContent = focusedJob()?.place || "Map";
  }
  if (state.galleryEvent && !state.events.some((item) => item.id === state.galleryEvent)) state.galleryEvent = null;
  renderAll();
}

function removeMessage(keys) {
  if (keys.length === 1 && keys[0].startsWith("job:")) return "Remove this role? Its media and events in this sketch go with it.";
  if (keys.every((key) => key.startsWith("job:"))) return `Remove ${keys.length} roles? Their media and events in this sketch go with them.`;
  if (keys.length === 1 && keys[0].startsWith("media:")) return "Remove this item?";
  if (keys.length === 1 && keys[0].startsWith("event:")) return "Remove this event?";
  if (keys.length === 1 && keys[0].startsWith("person:")) return "Remove this person?";
  if (keys.length === 1 && keys[0].startsWith("personal:")) return "Remove this personal item?";
  if (keys.length === 1 && keys[0].startsWith("social:")) return "Remove this link?";
  return `Remove ${keys.length} items?`;
}

async function removeKeys(keys) {
  if (!keys.length) return;
  const ok = await askRemove(removeMessage(keys));
  if (ok) dropKeys(keys);
}

function socialName(item) {
  if (item.label) return item.label;
  if (item.network === "github") return "GitHub";
  if (item.network === "x") return "X";
  if (item.network === "facebook") return "Facebook";
  return "Link";

function socialUrl(network, raw) {
  let url = String(raw || "").trim();
  if (!url) return "";
  if (network === "github" && !/^https?:\/\//i.test(url) && !/github\.com/i.test(url)) url = `https://github.com/${url.replace(/^@/, "")}`;
  if (!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)) url = `https://${url}`;
  return url;
}

function githubHandle(url) {
  const match = /github\.com\/([^/?#]+)/i.exec(String(url || ""));
  return match ? match[1] : String(url || "");
}

function socialFields(item) {
  const networks = [["github", "GitHub"], ["x", "X"], ["facebook", "Facebook"], ["other", "Other"]];
  const url = item && item.url && !String(item.url).startsWith("data:") ? item.url : "";
  return [
    pair(field("Network", selectBox("network", networks, (item && item.network) || "github")), field("Name", textInput("label", (item && item.label) || ""))),
    field("URL or GitHub name", textInput("url", url)),
    '<p class="field-hint">GitHub opens a small card for that profile. A GitHub name alone is enough. X, Facebook, and other links open the address.</p>',
  ].join("");
}

function socialMarks() {
  const items = state.socials.filter((item) => safeHref(item.url));
  if (!items.length) return "";
  const marks = items.map((item) => {
    const icon = socialIcon(item.network);
    const name = esc(socialName(item));
    if (item.network === "github") return `<button class="social-mark" type="button" data-github="${esc(item.id)}">${icon}<span>${name}</span></button>`;
    return `<a class="social-mark" href="${esc(safeHref(item.url))}" target="_blank" rel="noreferrer">${icon}<span>${name}</span></a>`;
  }).join("");
  return `<div class="socials">${marks}</div>`;
}

function writeSocial(item, form) {
  const data = new FormData(form);
  item.network = String(data.get("network") || "other");
  item.label = String(data.get("label") || "").trim();
  item.url = socialUrl(item.network, data.get("url"));
}

function openGithub(id) {
  const item = state.socials.find((entry) => entry.id === id);
  const href = item ? safeHref(item.url) : "";
  if (!item || !href) return;
  document.querySelector("#github-handle").textContent = githubHandle(item.url);
  const open = document.querySelector("#github-open");
  open.href = href;
  if (!githubDialog.open) githubDialog.showModal();
}

function renderPersonal() {
  document.querySelector("#personal-sub").textContent = state.profile.name || "";
  const body = document.querySelector("#personal-body");
  body.innerHTML = state.personal.length
    ? `<div class="gallery-scroll">${state.personal.map(mediaFigure).join("")}</div>`
    : '<p class="empty-note">No personal photos or video yet.</p>';
}

async function writePersonal(item, form) {
  const data = new FormData(form);
  const kind = String(data.get("kind") || "photo");
  const title = String(data.get("title") || "").trim();
  const caption = String(data.get("caption") || "").trim();
  const url = String(data.get("url") || "").trim();
  const file = data.get("file");
  item.kind = kind;
  item.title = title || "Untitled";
  item.caption = caption;
  if (file instanceof File && file.size) item.url = await fileUrl(file);
  else if (url) item.url = url;
}

function openBioItem(mode) {
  bioMode = mode;
  const title = document.querySelector("#bio-editor-title");
  const note = document.querySelector("#bio-editor-note");
  const save = document.querySelector("#bio-editor-save");
  const fields = document.querySelector("#bio-editor-fields");
  document.querySelector("#bio-editor-home").hidden = true;
  bioForm.hidden = false;
  if (mode.type === "social") {
    title.textContent = mode.id ? "Edit link" : "Add a link";
    save.textContent = mode.id ? "Save link" : "Add link";
    fields.innerHTML = socialFields(mode.id ? state.socials.find((item) => item.id === mode.id) : null);
    note.textContent = "GitHub opens a small card. X, Facebook, and other links open the address.";
  } else {
    title.textContent = mode.id ? "Edit piece" : "Add a personal piece";
    save.textContent = mode.id ? "Save piece" : "Add piece";
    fields.innerHTML = personalFields(mode.id ? state.personal.find((item) => item.id === mode.id) : null);
    note.textContent = "Photo, video, or another personal piece. A file stays in this page for the session.";
  }
  if (!bioEditor.open) bioEditor.showModal();
}

async function saveBioItem(event) {
  event.preventDefault();
  const form = event.target instanceof HTMLFormElement ? event.target : event.currentTarget;
  const mode = bioMode;
  if (!mode) return;
  if (mode.type === "social") {
    if (mode.id) {
      const item = state.socials.find((entry) => entry.id === mode.id);
      if (item) writeSocial(item, form);
      if (item && !item.url) state.socials = state.socials.filter((entry) => entry.id !== item.id);
    } else {
      const item = { id: nid("social"), network: "github", label: "", url: "" };
      writeSocial(item, form);
      if (item.url) state.socials.push(item);
    }
    showBioHome();
    renderAll();
    return;
  }
  if (mode.type !== "personal") return;
  if (mode.id) {
    const item = state.personal.find((entry) => entry.id === mode.id);
    if (item) await writePersonal(item, form);
  } else {
    const item = { id: nid("personal"), kind: "photo", title: "", url: "", caption: "" };
    await writePersonal(item, form);
    state.personal.push(item);
  }
  showBioHome();
  renderAll();
}

function mediaFigure(item) {
  let frame = "";
  if (item.player === "pan" && item.url) {
    frame = `<div class="clip" data-clip="${esc(item.id)}"><img src="${esc(item.url)}" alt=""><button class="play" type="button" data-play="${esc(item.id)}" aria-label="Play ${esc(item.title)}"><svg viewBox="0 0 16 16" aria-hidden="true">${playPath()}</svg></button><div class="clip-bar"><span>Video</span><input data-range="${esc(item.id)}" type="range" min="0" max="100" value="0" aria-label="${esc(item.title)} position"></div></div>`;
  } else if (item.kind === "video" && item.url) {
    frame = `<video controls src="${esc(item.url)}"></video>`;
  } else if (item.kind === "photo" && item.url) {
    frame = `<img src="${esc(item.url)}" alt=""${item.position ? ` style="object-position:${esc(item.position)}"` : ""}>`;
  } else {
    frame = `<div class="frame"><strong>${esc(kindLabel(item.kind))}</strong><span>${esc(item.title || "Untitled")}</span></div>`;
  }
  const status = typeof item.isPublic === "boolean" ? (item.isPublic ? "public" : "private") : "";
  const meta = [kindLabel(item.kind), status, item.caption].filter(Boolean).join(" · ");
  return `<figure>${frame}<figcaption><strong>${esc(item.title || "Untitled")}</strong><span>${esc(meta)}</span></figcaption></figure>`;
}

function bindClips() {
  galleryBody.querySelectorAll("[data-clip]").forEach((clip) => {
    const button = clip.querySelector("[data-play]");
    const range = clip.querySelector("[data-range]");
    const icon = button.querySelector("svg");
    let playing = false;
    let pan = 0;
    let last = 0;
    function paint() {
      clip.style.setProperty("--pan", String(pan));
      range.value = String(Math.round(pan * 100));
    }
    function iconFor() {
      icon.innerHTML = playing
        ? '<path d="M5 4.2h2.1v7.6H5zM8.9 4.2H11v7.6H8.9z" fill="currentColor"></path>'
        : playPath();
      button.setAttribute("aria-label", playing ? "Pause" : "Play");
    }
    function tick(now) {
      if (!playing) return;
      const dt = last ? (now - last) / 1000 : 0;
      last = now;
      pan = Math.min(1, pan + dt / 8);
      paint();
      if (pan >= 1) {
        playing = false;
        iconFor();
        return;
      }
      requestAnimationFrame(tick);
    }
    button.addEventListener("click", () => {
      if (pan >= 1) pan = 0;
      playing = !playing;
      last = 0;
      iconFor();
      if (playing) requestAnimationFrame(tick);
    });
    range.addEventListener("input", () => {
      playing = false;
      iconFor();
      pan = Number(range.value) / 100;
      paint();
    });
  });
}

function renderSelectBar() {
  return;
  const bar = document.querySelector("#select-bar");
  const toggle = document.querySelector("#select-toggle");
  bar.hidden = !state.selecting;
  toggle.setAttribute("aria-pressed", state.selecting ? "true" : "false");
  toggle.textContent = state.selecting ? "Done selecting" : "Select";
  const count = state.checked.size;
  const mixed = count >= 2 && !sameKind();
  document.querySelector("#select-count").textContent = count === 0
    ? "Select items"
    : `${count} selected${mixed ? " · select one kind to edit together" : ""}`;
  const shown = [...document.querySelectorAll("[data-check]")];
  const shownButton = document.querySelector("#select-shown");
  const allOn = shown.length > 0 && shown.every((input) => input.checked);
  shownButton.textContent = allOn ? "Clear shown" : "Select shown";
  shownButton.disabled = shown.length === 0;
  document.querySelector("#edit-selected").disabled = count !== 1;
  document.querySelector("#bulk-edit").disabled = !(count >= 2 && sameKind());
  document.querySelector("#remove-selected").disabled = count === 0;
}

  renderProfile();
  renderJobs();

  renderPins();
  if (gallery.open) renderGallery();
  if (peopleDialog.open) renderPeople();
  if (personalDialog.open) renderPersonal();

  if (bioEditor.open && bioHome && !bioHome.hidden) renderBioEditor();
  const home = document.querySelector("#editor-home");
  if (editor.open && home && !home.hidden) renderRoleEditor();
}

function closeAdd() {}

function startAdd(kind) {
  closeAdd();
  if (kind === "job") openEditor({ type: "job" });
  else if (!focusedJob()) openEditor({ type: "job" });
  else if (kind === "media") openEditor({ type: "media", kind: "photo" });
  else openEditor({ type: "event" });
}

function editKey(key) {
  const id = key.slice(key.indexOf(":") + 1);
  if (key.startsWith("job:")) openEditor({ type: "job", id });
  else if (key.startsWith("media:")) openEditor({ type: "media", id });
  else openEditor({ type: "event", id });
}

function editSelected() {
  const keys = checkedKeys();
  if (keys.length === 1) editKey(keys[0]);
}

function bulkEdit() {
  const kind = sameKind();
  const keys = checkedKeys();
  if (!kind || keys.length < 2) return;
  openEditor({ type: `bulk-${kind}`, keys });
}

function toggleShown() {
  const shown = [...document.querySelectorAll("[data-check]")];
  const allOn = shown.length > 0 && shown.every((input) => input.checked);
  for (const input of shown) {
    input.checked = !allOn;
    if (allOn) state.checked.delete(input.dataset.check);
    else state.checked.add(input.dataset.check);
  }
  renderSelectBar();
}

function focusOnMap(id) {
  const item = state.events.find((entry) => entry.id === id);
  const pin = mapWorld.querySelector(`.pin[data-event="${id}"]`);
  if (!item || !pin) return;
  state.mapEvent = id;
  mapWorld.querySelectorAll(".pin").forEach((entry) => entry.classList.toggle("is-on", entry.dataset.event === id));
  const map = document.querySelector("#map");
  mapWorld.style.transition = "none";
  mapWorld.style.transform = "translate(0px, 0px)";
  void mapWorld.offsetWidth;
  const mapBox = map.getBoundingClientRect();
  const pinBox = pin.getBoundingClientRect();
  const dx = mapBox.left + mapBox.width * 0.7 - (pinBox.left + pinBox.width / 2);
  const dy = mapBox.top + mapBox.height * 0.42 - (pinBox.top + pinBox.height / 2);
  mapWorld.style.transition = "";
  mapWorld.style.transform = `translate(${dx}px, ${dy}px)`;
  mapNote.textContent = item.place || "Map";
  mapCallout.hidden = false;
  mapCallout.dataset.event = id;
  document.querySelector("#callout-title").textContent = item.title || "Event";
  document.querySelector("#callout-place").textContent = item.place || "";
}

function openGallery(eventId) {
  const job = state.events.find((item) => item.id === eventId);
  if (job) state.focus = job.jobId;
  state.galleryEvent = eventId || null;
  state.reveal = Boolean(eventId);
  renderGallery();
  if (!gallery.open) gallery.showModal();
}

document.querySelector("#close-people").addEventListener("click", () => peopleDialog.close());
peopleDialog.addEventListener("click", (event) => {
  if (event.target === peopleDialog) peopleDialog.close();
});
document.querySelector("#close-job").addEventListener("click", () => jobDetail.close());
jobDetail.addEventListener("click", (event) => {
  if (event.target === jobDetail) jobDetail.close();
});
document.querySelector("#close-gallery").addEventListener("click", () => gallery.close());
document.querySelector("#editor-cancel").addEventListener("click", () => editor.close());
document.querySelector("#editor-back").addEventListener("click", () => {
  showEditorHome();
  renderRoleEditor();
});
editor.addEventListener("click", (event) => {
  if (event.target === editor) editor.close();
});
document.querySelector("#bio-editor-cancel").addEventListener("click", () => bioEditor.close());
document.querySelector("#bio-editor-back").addEventListener("click", () => {
  showBioHome();
  renderBioEditor();
});
bioEditor.addEventListener("click", (event) => {
  if (event.target === bioEditor) bioEditor.close();
});
bioEditor.addEventListener("submit", (event) => {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;
  if (form.id === "profile-form") {
    event.preventDefault();
    const data = new FormData(form);
    state.profile.name = String(data.get("name") || "").trim();
    state.profile.headline = String(data.get("headline") || "").trim();
    state.profile.address = String(data.get("address") || "").trim();
    state.profile.bio = String(data.get("bio") || "").trim();
    renderAll();
    return;
  }
  if (form.id === "personal-form") bioMode = { type: "personal" };
  if (form.id === "social-form") bioMode = { type: "social" };
  void saveBioItem(event);
});
document.querySelector("#close-github").addEventListener("click", () => githubDialog.close());
githubDialog.addEventListener("click", (event) => {
  if (event.target === githubDialog) githubDialog.close();
});
document.querySelector("#close-personal").addEventListener("click", () => personalDialog.close());
personalDialog.addEventListener("click", (event) => {
  if (event.target === personalDialog) personalDialog.close();
});
editor.addEventListener("submit", (event) => {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;
  if (form.id === "overview-form") {
    event.preventDefault();
    const job = focusedJob();
    if (job) writeJob(job, form, false);
    renderAll();
    return;
  }
  if (form.id === "media-form") editorMode = { type: "media" };
  if (form.id === "event-form") editorMode = { type: "event" };
  if (form.id === "person-form") editorMode = { type: "person" };
  void saveEditor(event);
});
gallery.addEventListener("close", () => {
  if (state.reveal && state.galleryEvent) focusOnMap(state.galleryEvent);
  state.reveal = false;
  state.galleryEvent = null;
});
gallery.addEventListener("click", (event) => {
  if (event.target === gallery) gallery.close();
});
document.querySelector("#callout-open").addEventListener("click", () => {
  if (mapCallout.dataset.event) openGallery(mapCallout.dataset.event);
});
mapWorld.addEventListener("click", (event) => {
  const pin = event.target.closest(".pin");
  if (pin) focusOnMap(pin.dataset.event);
});

document.addEventListener("click", (event) => {
  if (event.target.closest("[data-edit-profile]")) {
    showBioHome();
    renderBioEditor();
    if (!bioEditor.open) bioEditor.showModal();
    return;
  }
  if (event.target.closest("[data-know]")) {
    renderPersonal();
    if (!personalDialog.open) personalDialog.showModal();
    return;
  }
  if (event.target.closest("[data-edit-role]")) {
    showEditorHome();
    renderRoleEditor();
    if (!editor.open) editor.showModal();
    return;
  }
  if (event.target.closest("[data-worked]")) {
    renderPeople();
    if (!peopleDialog.open) peopleDialog.showModal();
    return;
  }
  const more = event.target.closest("[data-more]");
  if (more) {
    openJobDetail(more.dataset.more);
    return;
  }
  if (event.target.closest("#open-gallery")) {
    state.galleryEvent = null;
    state.reveal = false;
    renderGallery();
    gallery.showModal();
    return;
  }
  const editMedia = event.target.closest("[data-edit-media]");
  if (editMedia) {
    openEditor({ type: "media", id: editMedia.dataset.editMedia });
    return;
  }
  const removeMedia = event.target.closest("[data-remove-media]");
  if (removeMedia) {
    void removeKeys([`media:${removeMedia.dataset.removeMedia}`]);
    return;
  }
  const editEvent = event.target.closest("[data-edit-event]");
  if (editEvent) {
    openEditor({ type: "event", id: editEvent.dataset.editEvent });
    return;
  }
  const removeEvent = event.target.closest("[data-remove-event]");
  if (removeEvent) {
    void removeKeys([`event:${removeEvent.dataset.removeEvent}`]);
    return;
  }
  const editPerson = event.target.closest("[data-edit-person]");
  if (editPerson) {
    openEditor({ type: "person", id: editPerson.dataset.editPerson });
    return;
  }
  const editPersonal = event.target.closest("[data-edit-personal]");
  if (editPersonal) {
    openBioItem({ type: "personal", id: editPersonal.dataset.editPersonal });
    return;
  }
  const editSocial = event.target.closest("[data-edit-social]");
  if (editSocial) {
    openBioItem({ type: "social", id: editSocial.dataset.editSocial });
    return;
  }
  const removeSocial = event.target.closest("[data-remove-social]");
  if (removeSocial) {
    void removeKeys([`social:${removeSocial.dataset.removeSocial}`]);
    return;
  }
  const github = event.target.closest("[data-github]");
  if (github) {
    openGithub(github.dataset.github);
    return;
  }
  const removePersonal = event.target.closest("[data-remove-personal]");
  if (removePersonal) {
    void removeKeys([`personal:${removePersonal.dataset.removePersonal}`]);
    return;
  }
  if (event.target.closest("[data-clear-profile-photo]")) {
    state.profile.photo = "";
    renderAll();
    return;
  }
  const removePerson = event.target.closest("[data-remove-person]");
  if (removePerson) {
    void removeKeys([`person:${removePerson.dataset.removePerson}`]);
    return;
  }
  const open = event.target.closest("[data-open]");
  if (open) {
    state.galleryEvent = open.dataset.open;
    state.reveal = true;
    renderGallery();
    return;
  }
  const step = event.target.closest("[data-step]");
  if (step && state.galleryEvent) {
    const list = jobEvents(focusedJob()?.id);
    const index = list.findIndex((item) => item.id === state.galleryEvent);
    const next = list[(index + Number(step.dataset.step) + list.length) % list.length];
    if (next) {
      state.galleryEvent = next.id;
      renderGallery();
    }
    return;
  }
  const map = event.target.closest("[data-map]");
  if (map) {
    state.galleryEvent = map.dataset.map;
    state.reveal = true;
    gallery.close();
    return;
  }
  if (event.target.closest(".event-back")) {
    state.reveal = false;
    state.galleryEvent = null;
    renderGallery();
    return;
  }
  const card = event.target.closest("[data-focus]");
  if (card && !event.target.closest("button, a, input, label")) {
    state.focus = card.dataset.focus;
    renderJobs();
    renderMediaCard();
    if (!state.mapEvent) mapNote.textContent = focusedJob()?.place || "Map";
    if (gallery.open) renderGallery();
  }
});

document.addEventListener("change", (event) => {
  const input = event.target;
  if (!(input instanceof HTMLInputElement)) return;
  if (input.dataset.check) {
    if (input.checked) state.checked.add(input.dataset.check);
    else state.checked.delete(input.dataset.check);
    renderSelectBar();
    return;
  }
  if (input.dataset.profilePhoto && input.files && input.files[0]) {
    void fileUrl(input.files[0]).then((url) => {
      state.profile.photo = url;
      renderAll();
    });
    return;
  }
  if (input.dataset.cover && input.files && input.files[0]) {
    const jobId = input.dataset.cover;
    const file = input.files[0];
    void fileUrl(file).then((url) => {
      const cover = state.media.find((item) => item.jobId === jobId && item.kind === "photo");
      if (cover) {
        cover.url = url;
        delete cover.player;
      } else {
        state.media.unshift({ id: nid("media"), jobId, kind: "photo", title: "Cover photo", url, caption: "", isPublic: false });
      }
      renderAll();
    });
  }
});

renderAll();
    </script>
  </body>
